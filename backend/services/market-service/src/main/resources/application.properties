spring.config.import=optional:file:.env.properties
spring.application.name=market
spring.jackson.date-format=dd.MM.yyyy
spring.output.ansi.enabled=always

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.placeholder-replacement=false
spring.flyway.baseline-on-migrate=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB

logging.file.name=./logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.clean-history-on-start=false

logging.level.huynguyen.mock_binance.marke=debug
logging.level.com.zaxxer.hikari=debug
logging.level.org.springframework=info
logging.level.org.hibernate=info
logging.level.org.flywaydb=info

server.error.include-exception=false
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always
server.port=8080

spring.datasource.hikari.pool-name=exchange_lab_pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

app.security.jwtSecret=${JWT_SECRET}
app.security.jwtExpirationMs=${JWT_EXPIRATION_MS}